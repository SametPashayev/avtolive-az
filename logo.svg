<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 76" fill="none">
  <defs>
    <linearGradient id="proBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="proAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Precision Geometric Emblem -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#proBlueGrad)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Minimalist Aerodynamic Fastback Roofline & Horizon -->
    <path d="M11 40.5 C16 32.5, 24 25.5, 35.5 25.5 C43.5 25.5, 49.5 29.5, 54 35.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M9 44.5 H55" stroke="url(#proAccentGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Subtle Wheel Arcs -->
    <circle cx="20.5" cy="44.5" r="3.6" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle cx="44.5" cy="44.5" r="3.6" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="2.2"/>

    <!-- Minimal Live Signal Pulse (Top Right) -->
    <circle cx="49" cy="16" r="3.2" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M44 11.5 A7 7 0 0 1 53.5 21" stroke="#BAE6FD" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Precision Wordmark (Single <text> with <tspan> = Zero Overlap) -->
  <text x="82" y="40" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" letter-spacing="-0.6">
    <tspan font-weight="800" fill="#0F172A">AVTO</tspan><tspan font-weight="800" fill="#2563EB">LIVE</tspan><tspan font-weight="700" font-size="22" fill="#64748B">.az</tspan>
  </text>
  <text x="83" y="57" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" letter-spacing="2.1" fill="#64748B">CANLI AVTOMOBİL BAZARI</text>
</svg>
