<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" fill="none">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4B"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon Shield Emblem -->
  <g transform="translate(6, 6)">
    <rect x="2" y="2" width="76" height="68" rx="18" fill="url(#crimsonGrad)" stroke="#FF6B81" stroke-width="1.5"/>
    <!-- Animated Live Broadcast Waves -->
    <path d="M54 17 A18 18 0 0 1 67 34" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M58 11 A26 26 0 0 1 74 34" stroke="#FFD1D9" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <!-- Live Pulsing Dot -->
    <circle cx="51" cy="22" r="4" fill="#FFFFFF" filter="url(#glow)">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Sleek GT Coupe Silhouette -->
    <path d="M12 45 C15 41, 23 32, 34 31 L48 31 C55 31, 61 37, 66 43 L68 47 C68 49, 66 51, 63 51 L14 51 C11 51, 10 48, 12 45 Z" fill="#FFFFFF"/>
    <path d="M25 34 L35 33 L46 33 L54 40 L20 40 Z" fill="#1E293B"/>
    <!-- Wheels -->
    <circle cx="23" cy="51" r="7" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="23" cy="51" r="2.5" fill="#FF2A4B"/>
    <circle cx="55" cy="51" r="7" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="55" cy="51" r="2.5" fill="#FF2A4B"/>
  </g>

  <!-- Brand Typography: AVTOLIVE.AZ -->
  <g transform="translate(94, 18)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8" fill="url(#metalGrad)">AVTO</text>
    <text x="95" y="34" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8" fill="#FF2A4B">LIVE</text>
    <rect x="176" y="10" width="44" height="26" rx="7" fill="url(#crimsonGrad)"/>
    <text x="183" y="28" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">.AZ</text>
    <text x="2" y="53" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="1.6" fill="#94A3B8">CANLI AVTOMOBİL BAZARI</text>
  </g>
</svg>
