<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <defs>
    <linearGradient id="taBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="taEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Modern Emblem: Shield + Lightning Bid Checkmark -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#taBlue)"/>
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Price Tag / Bid Card Silhouette -->
    <rect x="13" y="15" width="38" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="2.2"/>
    <!-- Checkmark + Bolt -->
    <path d="M21 32.5 L28.5 40 L43.5 24" stroke="#34D399" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="49" cy="15" r="5" fill="url(#taEmerald)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Wordmark: TƏKLİFAL.az -->
  <text x="80" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="30" letter-spacing="-0.6">
    <tspan font-weight="900" fill="#0F172A">TƏKLİF</tspan><tspan font-weight="900" fill="#2563EB">AL</tspan><tspan font-weight="800" font-size="21" fill="#059669">.az</tspan>
  </text>
  <text x="81" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="1.8" fill="#64748B">USTA VƏ SERVİS QİYMƏT HƏRRACI</text>
</svg>
