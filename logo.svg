<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Squircle Blue Emblem -->
  <g transform="translate(6, 6)">
    <rect x="2" y="2" width="76" height="68" rx="20" fill="url(#blueGrad)" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Subtle Inner Glass Highlight -->
    <path d="M18 6 H62 C70 6 74 10 74 18 V22 C54 14 26 14 6 22 V18 C6 10 10 6 18 6 Z" fill="#FFFFFF" opacity="0.14"/>

    <!-- Animated Live Broadcast Waves -->
    <path d="M54 17 A18 18 0 0 1 67 34" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.92">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M58 11 A26 26 0 0 1 74 34" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <!-- Live Pulsing Dot -->
    <circle cx="51" cy="22" r="4" fill="#FFFFFF" filter="url(#blueGlow)">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Sleek Modern GT Coupe Silhouette -->
    <path d="M11 46 C15 40, 23 31, 35 30 L49 30 C56 30, 62 36, 67 43 L69 47 C69 49.5, 67 51.5, 63.5 51.5 L14 51.5 C10.5 51.5, 9.5 48.5, 11 46 Z" fill="#FFFFFF"/>
    <path d="M25 33.5 L35.5 32.5 L46.5 32.5 L54.5 39.5 L20 39.5 Z" fill="#1E40AF"/>
    <!-- Dynamic Speed Line -->
    <path d="M14 44.5 H64" stroke="#DBEAFE" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>

    <!-- Wheels -->
    <circle cx="23" cy="51.5" r="7" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="23" cy="51.5" r="2.6" fill="#38BDF8"/>
    <circle cx="55" cy="51.5" r="7" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="55" cy="51.5" r="2.6" fill="#38BDF8"/>
  </g>

  <!-- Modern Brand Typography: AVTOLIVE.AZ -->
  <g transform="translate(94, 18)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8" fill="url(#navyGrad)">AVTO</text>
    <text x="95" y="34" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8" fill="#2563EB">LIVE</text>
    <rect x="176" y="10" width="44" height="26" rx="8" fill="url(#pillGrad)"/>
    <text x="183" y="28" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">.AZ</text>
    <text x="2" y="53" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="1.6" fill="#64748B">CANLI AVTOMOBİL BAZARI</text>
  </g>
</svg>
