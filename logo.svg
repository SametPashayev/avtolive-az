<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 78" fill="none">
  <defs>
    <linearGradient id="avtoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C548E"/>
      <stop offset="100%" stop-color="#093D6B"/>
    </linearGradient>
    <linearGradient id="liveRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- 'A' + Integrated Steering Wheel Emblem with Top Signal Arcs -->
  <g transform="translate(8, 12)">
    <path d="M16 4 A10 10 0 0 1 28 4" stroke="#0C548E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M13 1 A14 14 0 0 1 31 1" stroke="#0C548E" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <!-- Subtle 'A' apex & legs framing the steering wheel -->
    <path d="M6 43 L22 9 L38 43" stroke="url(#avtoBlue)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Steering wheel ring inside A -->
    <circle cx="22" cy="29" r="12.5" stroke="url(#avtoBlue)" stroke-width="3.6" fill="#FFFFFF"/>
    <path d="M11.5 27.5 Q22 25 32.5 27.5" stroke="url(#avtoBlue)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M22 30 V40.5" stroke="url(#avtoBlue)" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="22" cy="29" r="4" fill="#FFFFFF" stroke="url(#avtoBlue)" stroke-width="1.8"/>
    <polygon points="21,27.2 24.3,29 21,30.8" fill="#DC2626"/>
  </g>

  <!-- 'VT' in Deep Automotive Blue -->
  <text x="53" y="54" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="-1" fill="url(#avtoBlue)">VT</text>

  <!-- 'O' with Red Play Triangle Inside -->
  <g transform="translate(107, 23)">
    <circle cx="16.5" cy="17" r="14.2" stroke="url(#avtoBlue)" stroke-width="6.2" fill="none"/>
    <polygon points="13.5,11 23,17 13.5,23" fill="url(#liveRed)"/>
  </g>

  <!-- 'LİVE' in Bold Red + Blue Broadcast Waves Above 'İ' -->
  <g transform="translate(143, 0)">
    <path d="M25 14 A13 13 0 0 1 43 14" stroke="#0C548E" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 9.5 A20 20 0 0 1 48 9.5" stroke="#0C548E" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="34" cy="19.5" r="3.4" fill="url(#liveRed)"/>
    <text x="0" y="54" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="0.5" fill="url(#liveRed)">LIVE</text>
  </g>

  <!-- Subtitle -->
  <text x="12" y="71" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.2" letter-spacing="1.65" fill="#1E3A5F">CANLI AVTOMOBİL BAZARI • AVTOLIVE.AZ</text>
</svg>
